<title>Fincas 3.0 · Cítricos</title>
<style>
:root{--bg:#f6f7f2;--card:#fff;--tx:#1d2a1a;--mu:#6b7a66;--ac:#e8820c;--ac2:#2f7d32;--bd:#dde2d6;--dn:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#141a12;--card:#1e271b;--tx:#eef2ea;--mu:#9aa995;--bd:#34412f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;background:var(--ac2);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;gap:8px;align-items:center;z-index:5}
header h1{font-size:18px;margin:0;flex:1}header button{background:rgba(255,255,255,.2)}
main{max-width:720px;margin:0 auto;padding:12px}
button,input,textarea,select{font:inherit}
button,.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;cursor:pointer}
button.s,.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--dn)}
.btn{display:block;text-align:center;text-decoration:none;flex:1;font-size:15px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px}.row>*{flex:1}.mu{color:var(--mu);font-size:14px}.item{cursor:pointer}.item b{font-size:17px}

.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}.kv div span{display:block;font-size:12px;color:var(--mu)}
.ph,.pv{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.ph img{width:92px;height:92px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);background:var(--bg)}

/* Fincas 2.10: modernización móvil */
:root{--bg:#f3f6f1;--ac2:#155e43;--ac:#e88722;--bd:#dbe6dc}
header{background:linear-gradient(120deg,#124c3c,#247953);box-shadow:0 4px 18px #123b2922}

.card{border-radius:20px;padding:18px;box-shadow:0 5px 22px #1c3c2410}
button,.btn,input,textarea,select{min-height:44px}button,.btn{font-weight:650}

}

/* Fincas 2.31: búsqueda avanzada y listados filtrados */
.search-panel{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:12px;margin:10px 0}

@media(max-width:390px){.filter-grid{gap:5px 7px}.filter-grid select{font-size:14px;padding:8px 6px}}

.search-main button{width:100%;min-height:46px;padding:9px 10px;white-space:nowrap;display:flex;align-items:center;justify-content:center}
@media(max-width:430px){.search-main{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.search-main input{grid-column:1/-1}.search-main button{width:100%}}

/* Fincas 2.38: corrección importación Excel */
.measure-help{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px;margin:7px 0;font-size:13px}
.measure-points{color:#155e43;font-weight:800}
.measure-summary{border:1px solid var(--bd);border-radius:10px;padding:10px;margin:8px 0;background:var(--bg)}

.measurement-row{border-left:4px solid var(--ac2);padding:8px 10px;margin:7px 0;background:var(--bg);border-radius:7px}
.measure-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.measure-actions button{flex:1 1 110px}
.vertex-icon{background:#fff;border:2px solid #155e43;border-radius:50%;width:26px;height:26px;line-height:22px;text-align:center;color:#155e43;font-size:11px;font-weight:800;box-shadow:0 1px 5px #0008}
.vertex-icon.selected{background:#f59e0b;border-color:#7c2d12;color:#fff}
.measure-toolbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.measure-toolbar button{padding:8px 5px;font-size:12px;min-height:40px}
.measure-status{font-size:12px;color:var(--mu);margin-top:6px}
#mapov.measure-active #mapa,#mapov.measure-active #mapa *{touch-action:none;cursor:crosshair}

/* Fincas 3.0 (sin servidor) · base 2.39: buscador universal, selección múltiple, polígonos por variedad */
.toast{z-index:80}
.mpan{max-height:48vh;overflow:auto}
.search-main{grid-template-columns:minmax(0,1fr) auto auto}
.search-main button{width:auto;padding:9px 12px}
@media(max-width:430px){.search-main{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.search-main input{grid-column:1/-1}}
.order-row{display:flex;gap:8px;align-items:center;margin:2px 0 8px}.order-row label{margin:0;white-space:nowrap}.order-row select{flex:1}
.selbox{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:15px;color:var(--tx)}.selbox input{width:22px;height:22px;min-height:0;flex:0 0 auto}
.card.item.sel{outline:3px solid var(--ac);background:#fff6e8}
@media (prefers-color-scheme:dark){.card.item.sel{background:#2d2a1a}}
.sel-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 22px #0003}
.sel-bar b{flex:1 1 100%}.sel-bar button{flex:1 1 30%;min-width:0}
.modal-bg{position:fixed;inset:0;z-index:70;background:#000b;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:18px;width:100%;max-width:520px;max-height:88vh;overflow:auto}
.modal ul{margin:8px 0;padding-left:20px;max-height:34vh;overflow:auto}
.modal .chk{display:flex;gap:8px;align-items:flex-start;font-weight:500;color:var(--tx);margin:8px 0}.modal .chk input{width:20px;height:20px;min-height:0;flex:0 0 auto;margin-top:2px}
.poly-row{display:flex;gap:7px;align-items:center;margin:6px 0}.poly-row>span:nth-child(2){flex:1;min-width:0}.poly-row button{flex:0 0 auto;min-height:36px;padding:4px 10px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:0 0 12px}
.warn{border-left:4px solid var(--dn);padding:6px 10px;margin:6px 0;background:var(--bg);border-radius:6px;font-size:13px}
.ok-line{color:var(--ac2);font-weight:700;font-size:14px}
</style></head><body>
<header><h1>🍊 Fincas <small style="font-size:11px;opacity:.8">3.0</small></h1><span class="status" id="net">●</span><span id="hb"></span></header>
<main id="app"></main><div id="toast" class="toast"></div>
<script>
// ---- Red de seguridad (3.0): si algo falla al arrancar, se muestra el motivo en pantalla en vez de quedarse en la portada ----
function mostrarFallo(msg){try{
  if(document.getElementById('fallo-arranque'))return;
  const faltan=['L','XLSX','jspdf'].filter(n=>typeof window[n]==='undefined');
  const d=document.createElement('div');d.id='fallo-arranque';
  d.style.cssText='position:fixed;left:8px;right:8px;top:8px;z-index:200;background:#fff;color:#111;border:3px solid #c00;border-radius:12px;padding:12px;font:14px/1.35 -apple-system,system-ui,sans-serif;max-height:70vh;overflow:auto;box-shadow:0 8px 30px #0006';
  d.innerHTML='<b>⚠️ Fincas no ha podido arrancar correctamente</b><div style="margin:6px 0;word-break:break-word">'+String(msg).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+'</div>'+(faltan.length?'<div>No se han cargado estas librerías: <b>'+faltan.join(', ')+'</b>. Comprueba la conexión o desactiva los bloqueadores de contenido.</div>':'')+'<div style="margin-top:8px"><button id="fa-rec" style="padding:10px 14px;font-size:15px">🔄 Recargar limpio</button> <button id="fa-cer" style="padding:10px 14px;font-size:15px">Cerrar</button></div><div style="font-size:12px;margin-top:6px;color:#555">«Recargar limpio» borra solo la caché de la aplicación (no tus datos ni tu sesión). Versión 3.0.</div>';
  document.body.appendChild(d);
  document.getElementById('fa-cer').onclick=()=>d.remove();
  document.getElementById('fa-rec').onclick=async()=>{try{const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch{}location.reload()};
}catch{}}
window.addEventListener('error',e=>mostrarFallo((e.message||'Error')+(e.lineno?' (línea '+e.lineno+')':'')));
window.addEventListener('unhandledrejection',e=>{const a=document.getElementById('app');if(a&&!a.children.length)mostrarFallo('Error: '+((e.reason&&e.reason.message)||e.reason))});
// Librerías opcionales (mapa, Excel, PDF): se cargan SIN bloquear el arranque y con fuentes alternativas. Sin red, la app funciona igual y solo esas funciones avisan.
(function(){
  const C='https://cdnjs.cloudflare.com/ajax/libs/',J='https://cdn.jsdelivr.net/npm/';
  const script=urls=>urls.reduce((p,u)=>p.catch(()=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.async=true;s.onload=()=>res();s.onerror=()=>{s.remove();rej(new Error(u))};document.head.appendChild(s)})),Promise.reject()).catch(()=>console.warn('Biblioteca opcional no disponible (sin conexión o bloqueada):',urls[0]));
  [C+'leaflet/1.9.4/leaflet.min.css',J+'leaflet@1.9.4/dist/leaflet.css'].reduce((p,u)=>p.catch(()=>new Promise((res,rej)=>{const l=document.createElement('link');l.rel='stylesheet';l.href=u;l.onload=()=>res();l.onerror=()=>{l.remove();rej()};document.head.appendChild(l)})),Promise.reject()).catch(()=>{});
  script([C+'leaflet/1.9.4/leaflet.min.js',J+'leaflet@1.9.4/dist/leaflet.js']);
  script([C+'jspdf/2.5.1/jspdf.umd.min.js',J+'jspdf@2.5.1/dist/jspdf.umd.min.js']);
  script([C+'xlsx/0.18.5/xlsx.full.min.js',J+'xlsx@0.18.5/dist/xlsx.full.min.js']);
})();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// ================= Almacén local (IndexedDB): Fincas 3.0 NO usa servidor =================
// «sb» conserva la misma interfaz que usaba la app (from/select/insert/update/delete, storage, auth) pero todo ocurre en este dispositivo.
if(!(window.crypto&&crypto.randomUUID)){try{crypto.randomUUID=()=>'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)})}catch{}}
const LOCAL={ok:false,db:null,mem:{fincas:[],anotaciones:[],madurez:[]},fotosMem:new Map(),chain:Promise.resolve(),persisted:null,error:''};
const IDB_NAME='fincas_v3',IDB_STORES=['fincas','anotaciones','madurez','fotos','meta'];
function idbOpen(){const abrir=new Promise((res,rej)=>{if(!window.indexedDB)return rej(Error('Este navegador no permite guardar datos locales (IndexedDB).'));const r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=()=>{const d=r.result;for(const s of IDB_STORES)if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:(s==='fotos'||s==='meta')?'k':'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error||Error('No se pudo abrir el almacén local'));r.onblocked=()=>rej(Error('Almacén bloqueado por otra pestaña'))});return Promise.race([abrir,new Promise((_,rej)=>setTimeout(()=>rej(Error('Tiempo de espera agotado al abrir el almacén local')),6000))])}
const idbReq=(store,mode,fn)=>new Promise((res,rej)=>{let req;const t=LOCAL.db.transaction(store,mode);t.oncomplete=()=>res(req?req.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||Error('Transacción cancelada'));try{req=fn(t.objectStore(store))}catch(e){rej(e)}});
const idbAll=s=>idbReq(s,'readonly',o=>o.getAll()),idbGet=(s,k)=>idbReq(s,'readonly',o=>o.get(k)),idbPut=(s,v)=>idbReq(s,'readwrite',o=>o.put(v)),idbDel=(s,k)=>idbReq(s,'readwrite',o=>o.delete(k)),idbClear=s=>idbReq(s,'readwrite',o=>o.clear()),idbCount=s=>idbReq(s,'readonly',o=>o.count());
const clonar=o=>JSON.parse(JSON.stringify(o));
function persistir(fn){LOCAL.chain=LOCAL.chain.then(()=>LOCAL.ok?fn():undefined).catch(e=>{LOCAL.error=String(e&&e.message||e);console.error('Almacén local',e);try{toast('⚠️ No se pudo guardar en este dispositivo: '+LOCAL.error)}catch{}});return LOCAL.chain}
async function localInit(){
  try{LOCAL.db=await idbOpen();LOCAL.ok=true;
    const [f,a,m]=await Promise.all([idbAll('fincas'),idbAll('anotaciones'),idbAll('madurez')]);LOCAL.mem={fincas:f||[],anotaciones:a||[],madurez:m||[]};

function queueSave(f,row){

function mismaFincaVariedades(a,b){
  const fincaA=normaliza(a.finca),fincaB=normaliza(b.finca);
  const propA=normaliza(a.propietarios),propB=normaliza(b.propietarios);

  return !!(fincaA&&propA&&fincaA===fincaB&&propA===propB);

// La coordenada general se comparte entre variedades de la misma finca; nunca se copian referencias SIGPAC.
function propagarUbicacionFinca(origen,lat,lng){
  if(num(lat)==null||num(lng)==null)return 0;
  let total=0;
  for(const hermana of fincas){
    if(hermana.id===origen.id||!mismaFincaVariedades(origen,hermana))continue;
    const tieneCoordParcela=Array.isArray(hermana.parcelas)&&hermana.parcelas.some(geolocalizable);
    // No tocar parcelas ya georreferenciadas: solo actualizar la ubicación general.
    if(tieneCoordParcela)continue;
    if(num(hermana.lat)===num(lat)&&num(hermana.lng)===num(lng))continue;
    if(queueSave(hermana,{lat:num(lat),lng:num(lng)}))total++;
  }
  return total;
}

async function importarExcelFincas(file){
  if(typeof XLSX==='undefined')return toast('No se ha podido cargar el lector de Excel.');
  let wb,rows;
  try{
    const data=await file.arrayBuffer();
    wb=XLSX.read(data,{type:'array',cellDates:false});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const matrix=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    const norm=s=>normaliza(String(s??'')).replace(/[^a-z0-9]/g,'');
    const aliases={
      propietario:['propietario','propietarios','titular'],
      finca:['nombre finca','finca','nombre'],
      provincia:['provincia'],
      municipio:['termino municipal','termino','municipio'],
      variedad:['variedad'],
      patron:['patron'],
      superficie:['superficie ha','superficie'],
      arboles:['n arboles','numero arboles','arboles'],
      marco:['marco','marco plantacion'],
      anio:['ano plantacion','anio plantacion','ano']
    };
    let hi=-1,idx={};
    for(let r=0;r<Math.min(matrix.length,20);r++){
      const h=matrix[r].map(norm),candidate={};
      for(const [k,als] of Object.entries(aliases)){candidate[k]=h.findIndex(x=>als.some(a=>norm(a)===x))}
      if(candidate.finca>=0&&candidate.variedad>=0&&candidate.propietario>=0){hi=r;idx=candidate;break}
    }
    if(hi<0)throw Error('No encuentro una fila de encabezados reconocible. Debe incluir Propietario, Nombre Finca y Variedad.');
    rows=matrix.slice(hi+1).filter(r=>r.some(v=>String(v??'').trim()!=='')).map(r=>{
      const get=k=>idx[k]>=0?String(r[idx[k]]??'').trim():'';
      return {propietario:get('propietario'),finca:get('finca'),provincia:get('provincia'),municipio:get('municipio'),variedad:get('variedad'),patron:get('patron'),superficie:get('superficie'),arboles:get('arboles'),marco:get('marco'),anio:get('anio')};
    }).filter(r=>r.finca||r.propietario||r.variedad);
  }catch(e){return toast('No se pudo leer el archivo: '+e.message)}
  const valid=rows.filter(r=>r.finca&&r.variedad);
  const skipped=rows.length-valid.length;
  const key=r=>[r.finca,r.propietario,r.variedad,r.municipio].map(normaliza).join('|');
  const existing=new Set(fincas.map(f=>key({finca:f.finca,propietario:f.propietarios,variedad:f.variedad,municipio:f.municipio})));
  const duplicates=valid.filter(r=>existing.has(key(r)));
  const fresh=valid.filter(r=>!existing.has(key(r)));
  const summary=`Archivo: ${file.name}\nFilas leídas: ${rows.length}\nRegistros importables: ${valid.length}\nCoincidencias ya existentes: ${duplicates.length}\nSin nombre de finca o variedad: ${skipped}\n\nSe importarán ${fresh.length} registros nuevos. ¿Continuar?`;
  if(!fresh.length)return toast('No hay registros nuevos para importar. Duplicados: '+duplicates.length+' · incompletos: '+skipped);
  if(!confirm(summary))return;
  let imported=0,errors=0,metadata=0,firstError="";
  for(const r of fresh){
    const prov=PROVINCIAS.find(p=>normaliza(p[1])===normaliza(r.provincia));
    const sup=num(r.superficie);
    const marcoMatch=r.marco.match(/(\d+(?:[.,]\d+)?)\s*[x×\/-]\s*(\d+(?:[.,]\d+)?)/i);
    const marcoA=marcoMatch?num(marcoMatch[1]):num(r.marco),marcoB=marcoMatch?num(marcoMatch[2]):null;
    const parcela={prov_cod:prov?.[0]||null,mun_cod:null,municipio:r.municipio||'',poligono:'',parcela:'',recinto:'',uso_sigpac:'',superficie:sup,lat:null,lng:null};
    const row={finca:r.finca,propietarios:r.propietario,variedad:r.variedad,patron:r.patron||'',superficie:sup,marco_a:marcoA,marco_b:marcoB,municipio:r.municipio||'',poligono:'',parcela:'',recinto:null,lat:null,lng:null,prov_cod:prov?.[0]||null,mun_cod:null,parcelas:[parcela]};
    try{
      const id=crypto.randomUUID();
      const result=await sb.from('fincas').insert({...row,id});
      if(result.error)throw result.error;
      imported++;
      const extra=['Datos originales del Excel',r.provincia?'Provincia: '+r.provincia:'',r.arboles?'Número de árboles: '+r.arboles:'',r.marco?'Marco original: '+r.marco:'',r.anio?'Año de plantación: '+r.anio:''].filter(Boolean).join(' · ');
      if(extra){
        const a=await sb.from('anotaciones').insert({finca_id:id,texto:extra,fotos:[]});
        if(a.error){metadata++;console.warn('No se pudo guardar la anotación de origen',a.error)}
      }
    }catch(e){errors++;if(!firstError)firstError=(e?.message||String(e)).slice(0,220);console.error('Error importando finca',r.finca,e)}
  }
  await load();
  view='list';render();
  toast(`Importación terminada: ${imported} fincas · ${errors} errores${metadata?' · '+metadata+' notas de datos originales pendientes':''}.${firstError?' Primer error: '+firstError:''}`);
}

async function restoreBackup(file){

      const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
      for(const sheet of ['CONTROL','FINCAS','ANOTACIONES','MADUREZ'])if(!wb.Sheets[sheet])throw Error('Falta la hoja '+sheet);
      const control=XLSX.utils.sheet_to_json(wb.Sheets.CONTROL)[0];if(!control)throw Error('Hoja de control vacía.');

      const {error}=await sb.from('anotaciones').insert({id:n.id,finca_id:n.finca_id,...safeBackupRow(n,['fecha','texto']),fotos:keep});if(error)throw Error('Anotación '+n.id+': '+error.message);seenN.add(n.id);cN++}

  }catch(e){await load();render();alert('Recuperación interrumpida: '+(e&&e.message||e)+'\nLos registros ya importados permanecen guardados.')}

  try{
    toast('Conectando…');
    const tk=await fetch(MIG_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:MIG_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:cred.em,password:cred.pw})});
    const tj=await tk.json().catch(()=>({}));if(!tk.ok||!tj.access_token)throw Error('Email o contraseña incorrectos.');
    const H1={apikey:MIG_KEY,Authorization:'Bearer '+tj.access_token};
    const traer=async t=>{const out=[];for(let o=0;o<100000;o+=500){const r=await fetch(`${MIG_URL}/rest/v1/${t}?select=*&order=id.asc&limit=500&offset=${o}`,{headers:H1});if(!r.ok)throw Error(t+': HTTP '+r.status);const d=await r.json();out.push(...d);if(d.length<500)break}return out};
    const urlFoto=async p=>{const r=await fetch(`${MIG_URL}/storage/v1/object/sign/fotos/${p.split('/').map(encodeURIComponent).join('/')}`,{method:'POST',headers:{...H1,'Content-Type':'application/json'},body:JSON.stringify({expiresIn:600})});if(!r.ok)throw Error('sin url');const j=await r.json();return MIG_URL+'/storage/v1'+j.signedURL};
    toast('Descargando registros…');
    const rf=await traer('fincas'),rn=await traer('anotaciones'),rm=await traer('madurez');
    const idsF=new Set(LOCAL.mem.fincas.map(x=>x.id)),idsN=new Set(LOCAL.mem.anotaciones.map(x=>x.id)),idsM=new Set(LOCAL.mem.madurez.map(x=>x.id));
    let cF=0,cN=0,cM=0,cP=0,pFalla=0;
    for(const f of rf){if(idsF.has(f.id))continue;const {user_id,anotaciones,...row}=f;const r=await sb.from('fincas').insert(row);if(!r.error){idsF.add(f.id);cF++}}
    for(const n of rn){
      if(!idsF.has(n.finca_id))continue;
      const paths=Array.isArray(n.fotos)?n.fotos:[];
      for(const p of paths){if(await fotoGet(p))continue;
        try{const resp=await fetch(await urlFoto(p));if(!resp.ok)throw Error('http '+resp.status);await fotoPut(p,await resp.blob());cP++;toast('Fotos descargadas: '+cP)}catch(e){pFalla++}}
      if(idsN.has(n.id)){const loc=LOCAL.mem.anotaciones.find(x=>x.id===n.id);if(loc&&(!loc.fotos||!loc.fotos.length)&&paths.length)await sb.from('anotaciones').update({fotos:paths}).eq('id',n.id);continue}
      const {user_id,...row}=n;const r=await sb.from('anotaciones').insert(row);if(!r.error){idsN.add(n.id);cN++}}
    for(const m of rm){if(idsM.has(m.id)||(m.finca_id&&!idsF.has(m.finca_id)))continue;const {user_id,...row}=m;const r=await sb.from('madurez').insert(row);if(!r.error){idsM.add(m.id);cM++}}
    await load();view='list';render();
    alert('Traspaso terminado.\nAñadidas: '+cF+' fincas, '+cN+' anotaciones, '+cM+' pruebas y '+cP+' fotos.'+(pFalla?'\n'+pFalla+' fotos no se pudieron descargar.':'')+'\n\nTus datos en la nube no se han tocado. Haz ahora una copia de seguridad (🛡️).');
  }catch(e){await load();render();alert('No se pudo completar el traspaso: '+(e&&e.message||e)+'\nLo que ya se había copiado permanece guardado.')}
}
// ---- panel «Datos» ----
async function panelDatos(){
  let fotosN=0,uso='';
  try{fotosN=LOCAL.ok?await idbCount('fotos'):LOCAL.fotosMem.size}catch{}
  try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();uso=' · espacio usado: '+((e.usage||0)/1048576).toFixed(1)+' MB'}}catch{}
  const u=ultimaCopia();
  const html=`<p><b>💾 Tus datos están guardados en este dispositivo</b> (no dependen de ningún servidor).</p><p class="mu">${LOCAL.mem.fincas.length} fincas · ${LOCAL.mem.anotaciones.length} anotaciones · ${fotosN} fotos · ${LOCAL.mem.madurez.length} pruebas de madurez${uso}<br>Última copia de seguridad: ${u?new Date(u).toLocaleString('es-ES'):'<b>ninguna</b>'}<br>Almacenamiento permanente: ${LOCAL.persisted===true?'sí':'no garantizado'}${LOCAL.ok?'':'<br><b>⚠️ Este navegador no permite guardar datos: haz copias con frecuencia.</b>'}</p>
  <div class="row w" style="flex-direction:column;align-items:stretch;gap:8px"><button type="button" id="pd_bk">🛡️ Hacer copia de seguridad</button><button type="button" class="s" id="pd_rs">♻️ Restaurar copia (.json / .xlsx)</button><button type="button" class="s" id="pd_mg">☁️ Traer datos de la versión anterior (nube)</button><button type="button" class="s" id="pd_ls">🔎 Buscar datos de la versión anterior en este dispositivo</button><button type="button" class="d" id="pd_del">🗑 Borrar todos los datos de este dispositivo</button></div>
  <p class="mu" style="margin-top:10px">Consejo: instala la app en la pantalla de inicio y haz una copia al menos cada semana. Si borras los datos del navegador o desinstalas la app sin copia, no se pueden recuperar.</p>`;
  await dialogo({titulo:'⚙️ Datos y copias',html,ok:'Cerrar',cancel:null,abrir:(bg,fin)=>{
    const go=f=>()=>{fin(true);setTimeout(f,50)};
    bg.querySelector('#pd_bk').onclick=go(exportBackup);
    bg.querySelector('#pd_rs').onclick=go(()=>{const i=document.createElement('input');i.type='file';i.accept='.json,.xlsx,application/json';i.onchange=async()=>{const fl=i.files[0];if(fl)await restoreBackup(fl)};i.click()});
    bg.querySelector('#pd_mg').onclick=go(migrarDesdeSupabase);
    bg.querySelector('#pd_ls').onclick=go(()=>ofrecerDatosAntiguos(true));
    bg.querySelector('#pd_del').onclick=go(borrarTodoLocal)}});
}
async function borrarTodoLocal(){
  const c1=await dialogo({titulo:'Borrar todos los datos',html:`<p>Se borrarán <b>todas</b> las fincas, anotaciones, fotos y pruebas de madurez de <b>este dispositivo</b>. No afecta a copias de seguridad ya guardadas.</p><p class="mu">Si no tienes una copia reciente, cancela y haz antes la copia de seguridad.</p>`,ok:'Continuar',peligro:true});
  if(!c1)return;
  const c2=await dialogo({titulo:'Confirmación final',html:`<p><b>No se puede deshacer.</b></p>`,ok:'Borrar todo',peligro:true,palabra:'BORRAR',espera:2});
  if(!c2)return;
  await LOCAL.chain;
  LOCAL.mem={fincas:[],anotaciones:[],madurez:[]};LOCAL.fotosMem.clear();
  if(LOCAL.ok)for(const s of ['fincas','anotaciones','madurez','fotos'])await idbClear(s);
  for(const k of Object.keys(urlCache)){try{URL.revokeObjectURL(urlCache[k])}catch{}delete urlCache[k]}
  fincas=[];mads=[];sel.clear();selMode=false;view='list';cur=null;render();toast('Datos de este dispositivo borrados.');
}
// ---------- exportar ----------
const fname=e=>'fincas'+(q?'_'+q.slice(0,40):'')+'.'+e;
const safeFileName=s=>String(s).replace(/[\\/:*?"<>|]/g,'_').replace(/\s+/g,'_');
function dl(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=safeFileName(name);document.body.appendChild(a);a.click();a.remove()}
async function exportExcel(){
  if(typeof XLSX==='undefined')return toast('Excel necesita conexión la primera vez para cargar la biblioteca.');
  // Exportar solo las fincas del usuario y sus parcelas; una fila por parcela.
  let all=[...fincas];
  all=all.filter(f=>coincideBusqueda(f)).sort(cmpFincas);
  const rows=all.flatMap(f=>{
    const parcelas=parcelasDe(f);
    const items=parcelas.length?parcelas:[{}];
    return items.map((p,i)=>({
      Finca:f.finca||'',Propietario:f.propietarios||'',Variedad:f.variedad||'',
      Patron:f.patron||'',Superficie_finca_ha:f.superficie??'',
      Marco_A_m:f.marco_a??'',Marco_B_m:f.marco_b??'',Arboles:arb(f),
      Provincia:nombreProv(p.prov_cod||f.prov_cod)||'',
      Codigo_provincia:p.prov_cod||f.prov_cod||'',
      Municipio:p.municipio||f.municipio||'',
      Codigo_municipio:p.mun_cod||f.mun_cod||'',
      Poligono:String(p.poligono??f.poligono??''),
      Parcela:String(p.parcela??f.parcela??''),
      Recinto:String(p.recinto??f.recinto??''),
      Uso_SIGPAC:p.uso_sigpac||'',
      Superficie_parcela_ha:p.superficie??'',
      Latitud:p.lat??f.lat??'',Longitud:p.lng??f.lng??'',
      Numero_parcela:i+1
    }));
  });
  if(!rows.length)return toast('No hay fincas para exportar.');
  const wb=XLSX.utils.book_new();
  const sh=XLSX.utils.json_to_sheet(rows);
  sh['!cols']=Object.keys(rows[0]).map(k=>({wch:Math.min(35,Math.max(13,k.length+3))}));
  sh['!autofilter']={ref:sh['!ref']};
  XLSX.utils.book_append_sheet(wb,sh,'Fincas y parcelas');
  XLSX.writeFile(wb,'Fincas_listado_filtrado_'+new Date().toISOString().slice(0,10)+'.xlsx');
}
function exportCsv(){const rows=filtered();if(!rows.length)return toast('No hay fincas con esa búsqueda.');
  const cols=['finca','propietarios','variedad','patron','superficie_ha','marco_a','marco_b','arboles','municipio','poligono','parcela','latitud','longitud','ultima_visita'];
  const c=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const L=[cols.join(';')].concat(rows.map(f=>[f.finca,f.propietarios,f.variedad,f.patron,f.superficie,f.marco_a,f.marco_b,arb(f),munis(f).join(' | '),parcelasDe(f).map(p=>p.poligono||'').join(' | '),parcelasDe(f).map(p=>p.parcela||'').join(' | '),f.lat,f.lng,fmt(lastVisit(f))].map(c).join(';')));
  dl(fname('csv'),new Blob(['\ufeff'+L.join('\n')],{type:'text/csv;charset=utf-8'}))}
function exportPdf(){const rows=filtered();if(!rows.length)return toast('No hay fincas con esa búsqueda.');
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J)return toast('No se pudo cargar el generador de PDF.');
  const d=new J({orientation:'landscape',unit:'mm',format:'a4'});
  const C=[['Finca',36,f=>f.finca],['Propietarios',32,f=>f.propietarios],['Variedad',26,f=>f.variedad],['Patrón',25,f=>f.patron],['Sup. (ha)',14,f=>f.superficie],['Marco',16,f=>(f.marco_a&&f.marco_b)?f.marco_a+'x'+f.marco_b:''],['Árboles',17,f=>arb(f)],['Término municipal',40,f=>munis(f).join(', ')],['Pol./Parc.',28,f=>parcelasDe(f).map(p=>(p.poligono||'-')+'/'+(p.parcela||'-')).join(' · ')||'-'],['Últ. visita',36,f=>fmt(lastVisit(f))]];
  const left=10, tableW=270, bottom=194, lineH=4.2;
  let y=0;
  const head=()=>{
    d.setTextColor(25,45,28);d.setFontSize(15);d.setFont(undefined,'bold');d.text('Listado de fincas de cítricos',left,14);
    d.setFontSize(9);d.setFont(undefined,'normal');d.setTextColor(70,70,70);
    d.text('Búsqueda: '+(q||'todas las fincas')+'   ·   Registros: '+rows.length,left,20);d.text('Orden: '+orden+'   ·   Fecha: '+new Date().toLocaleDateString('es-ES'),left,25);
    y=32;const hh=14;d.setFillColor(47,105,51);d.roundedRect(left,y,tableW,hh,1,1,'F');
    d.setTextColor(255,255,255);d.setFont(undefined,'bold');d.setFontSize(8.5);let x=left;
    C.forEach(c=>{const label=d.splitTextToSize(c[0],c[1]-5);const textH=label.length*3.7;const ty=y+(hh-textH)/2+3.0;d.text(label,x+c[1]/2,ty,{align:'center'});x+=c[1]});
    d.setTextColor(0);d.setFont(undefined,'normal');d.setFontSize(8);y+=hh+2;
  };
  head();
  rows.forEach((f,i)=>{
    const cells=C.map(c=>d.splitTextToSize(String(c[2](f)??'—'),c[1]-5));
    const maxLines=Math.max(1,...cells.map(l=>l.length));
    const h=Math.max(8,maxLines*lineH+4.5);
    if(y+h>bottom){d.addPage();head()}
    if(i%2===0){d.setFillColor(244,247,242);d.rect(left,y,tableW,h,'F')}
    d.setDrawColor(210,218,208);d.setLineWidth(.18);d.line(left,y+h,left+tableW,y+h);
    let x=left;
    cells.forEach((lines,j)=>{
      if(j>0){d.setDrawColor(224,229,222);d.line(x,y,x,y+h)}
      const textH=lines.length*lineH;const ty=y+(h-textH)/2+3.0;
      d.setFontSize(8);d.setTextColor(35,35,35);d.text(lines,x+2.5,ty);
      x+=C[j][1];
    });
    y+=h+0.3;
  });
  const tot=rows.reduce((s,f)=>s+(+f.superficie||0),0),ta=rows.reduce((s,f)=>s+arb(f),0);
  if(y+10>bottom){d.addPage();y=16}else y+=3;
  d.setDrawColor(47,105,51);d.setLineWidth(.5);d.line(left,y,left+tableW,y);
  d.setFont(undefined,'bold');d.setFontSize(9);d.setTextColor(25,45,28);d.text(rows.length+' fincas   ·   '+tot.toFixed(2)+' ha   ·   '+ta.toLocaleString('es-ES')+' árboles',left,y+6);
  dl(fname('pdf'),d.output('blob'))}
