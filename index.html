<style>

:root{--bg:#f3f6f1;--ac2:#155e43;--ac:#e88722;--bd:#dbe6dc}

<header><h1>🍊 Fincas <small style="font-size:11px;opacity:.8">2.0</small></h1><span class="status" id="net">●</span><span id="hb"></span></header>
<main id="app"></main><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let fincas=[],view='login',cur=null,q='',fv='',fm='',draft=null,pend=[],urlCache={};
const fmt=iso=>iso?new Date(iso).toLocaleString('es-ES',{dateStyle:'short',timeStyle:'short'}):'—';
const num=v=>{v=String(v??'').replace(',','.').trim();return v===''||isNaN(v)?null:+v};
const arb=f=>{const a=+f.marco_a,b=+f.marco_b,s=+f.superficie;return a>0&&b>0&&s>0?Math.round(10000/(a*b)*s):0};
const hasGeo=f=>f.lat!=null&&f.lng!=null;
const mapsUrl=f=>`https://www.google.com/maps?q=${f.lat},${f.lng}(${encodeURIComponent(String(f.finca||'Finca').replace(/[()]/g,' '))})&z=18`;
const satUrl=f=>`https://www.google.com/maps/@${f.lat},${f.lng},18z/data=!3m1!1e3`;
const SIG='https://sigpac.mapa.gob.es/fega/visor/';
// Catálogo municipal basado en la relación de municipios y códigos INE; se descarga una vez y queda en caché para uso sin conexión.
const MUNICIPIOS_URL='https://raw.githubusercontent.com/codeforspain/ds-organizacion-administrativa/master/data/municipios.json';
const MUNICIPIOS_CACHE='fincas_municipios_ine_2026';
let municipiosINE=[];
function nombreMunicipioClave(s){let n=normaliza(s);if(n.includes(',')){const a=n.split(',').map(x=>x.trim());if(a.length===2){const art=a[1];if(['la','el','los','las'].includes(art))n=art+' '+a[0];}}return n}
async function cargarCatalogoMunicipios(){try{const cached=JSON.parse(localStorage.getItem(MUNICIPIOS_CACHE)||'[]');if(Array.isArray(cached)&&cached.length>7000)municipiosINE=cached;}catch{}
  if(!navigator.onLine)return municipiosINE;
  try{const r=await fetch(MUNICIPIOS_URL,{cache:'no-cache'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();if(Array.isArray(data)&&data.length>7000){municipiosINE=data;try{localStorage.setItem(MUNICIPIOS_CACHE,JSON.stringify(data))}catch{}}}catch(e){console.warn('Catálogo de municipios no actualizado; se usa la copia local si existe.',e)}return municipiosINE}
function buscarMunicipio(prov,nombre){const clave=nombreMunicipioClave(nombre);return municipiosINE.find(m=>m.provincia_id===prov&&(nombreMunicipioClave(m.nombre)===clave||normaliza(m.nombre)===normaliza(nombre)))}
const normaliza=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase().replace(/^(el|la|los|las)\s+/,'').replace(/\s+/g,' ');
const VARIEDADES={Naranjas:['Navelina','Newhall','Washington Navel','Navelate','Lane Late','Powell Summer Navel','Barnfield','Chislett Summer Navel','Salustiana','Valencia Late','Valencia Midknight','Valencia Delta Seedless'],Mandarinas:['Oronules','Clemenules','Clemenvilla','Marisol','Orogrande','Orri','Tango','Nadorcott','Ortanique','Hernandina','Arrufatina']};
const PATRONES=['Carrizo','Troyer','Citrus macrophylla','Cleopatra','Forner-Alcaide nº 5','Forner-Alcaide nº 13','Forner-Alcaide nº 517','C-35','Citrumelo Swingle','Poncirus trifoliata','Volkameriana','Naranjo amargo'];
const PROVINCIAS=[['01','Álava'],['02','Albacete'],['03','Alicante'],['04','Almería'],['05','Ávila'],['06','Badajoz'],['07','Illes Balears'],['08','Barcelona'],['09','Burgos'],['10','Cáceres'],['11','Cádiz'],['12','Castellón'],['13','Ciudad Real'],['14','Córdoba'],['15','A Coruña'],['16','Cuenca'],['17','Girona'],['18','Granada'],['19','Guadalajara'],['20','Gipuzkoa'],['21','Huelva'],['22','Huesca'],['23','Jaén'],['24','León'],['25','Lleida'],['26','La Rioja'],['27','Lugo'],['28','Madrid'],['29','Málaga'],['30','Murcia'],['31','Navarra'],['32','Ourense'],['33','Asturias'],['34','Palencia'],['35','Las Palmas'],['36','Pontevedra'],['37','Salamanca'],['38','Santa Cruz de Tenerife'],['39','Cantabria'],['40','Segovia'],['41','Sevilla'],['42','Soria'],['43','Tarragona'],['44','Teruel'],['45','Toledo'],['46','Valencia'],['47','Valladolid'],['48','Bizkaia'],['49','Zamora'],['50','Zaragoza'],['51','Ceuta'],['52','Melilla']];
const ANDALUCIA=new Set(['04','11','14','18','21','23','29','41']);
// Lista local de sugerencias iniciales; se permite cualquier municipio para no bloquear registros.
const MUNICIPIOS_BASE={'41':['La Rinconada','Sevilla','Dos Hermanas','Alcalá de Guadaíra','Carmona','Écija','Utrera','Los Palacios y Villafranca','Brenes','Alcalá del Río','Cantillana','Lora del Río','La Algaba','Guillena'],'21':['Huelva','Lepe','Cartaya','Almonte','Moguer','Palos de la Frontera','Bollullos Par del Condado'],'14':['Córdoba','Palma del Río','Posadas','Almodóvar del Río'],'11':['Cádiz','Jerez de la Frontera','Sanlúcar de Barrameda','Arcos de la Frontera'],'29':['Málaga','Vélez-Málaga','Coín','Cártama'],'18':['Granada','Motril','Almuñécar','Salobreña'],'23':['Jaén','Andújar','Linares'],'04':['Almería','El Ejido','Níjar']};
const option=(v,t,selected)=>`<option value="${esc(v)}" ${String(v)===String(selected??'')?'selected':''}>${esc(t)}</option>`;
const selectOrOther=(id,values,selected,placeholder)=>`<select id="${id}">${option('',placeholder,selected)}${[...new Set([...values,...(selected?[selected]:[])])].map(v=>option(v,v,selected)).join('')}${option('__otro__','Otra / escribir manualmente…','')}</select><input id="${id}_otro" style="display:none;margin-top:6px" placeholder="Escribe el valor">`;
function setupOther(id){const el=$('#'+id),other=$('#'+id+'_otro');el.onchange=()=>{other.style.display=el.value==='__otro__'?'block':'none'};return()=>el.value==='__otro__'?other.value.trim():el.value}
function sigUrl(f){
  // Formato de parámetros publicado en la ayuda oficial del Visor SIGPAC.
  const u=new URL(SIG);
  if(f.prov_cod&&f.mun_cod&&f.poligono&&f.parcela){
    u.searchParams.set('provincia',String(f.prov_cod).padStart(2,'0'));
    u.searchParams.set('municipio',String(f.mun_cod).padStart(3,'0'));
    u.searchParams.set('agregado','0');u.searchParams.set('zona','0');
    u.searchParams.set('poligono',String(f.poligono).trim());
    u.searchParams.set('parcela',String(f.parcela).trim());
    if(f.recinto)u.searchParams.set('recinto',String(f.recinto).trim());
  }else if(hasGeo(f)){
    // El visor oficial no documenta estos parámetros como devolución de parcela; solo se intenta centrar por coordenadas.
    u.searchParams.set('x',String(f.lng));u.searchParams.set('y',String(f.lat));u.searchParams.set('srid','4326');u.searchParams.set('r','400');
  }
  return u.href;
}
// ---------- mapa integrado (SIGPAC oficial + chinchetas) ----------
const SIG_API='https://sigpac-hubcloud.es/servicioconsultassigpac/query/recinfobypoint/4326/';
const SIG_WMS='https://wms.mapa.gob.es/sigpac/wms';
async function sigPunto(lat,lng){const r=await fetch(SIG_API+lng.toFixed(7)+'/'+lat.toFixed(7)+'.json');if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();return Array.isArray(d)?d:[]}
function wktRings(w){const out=[],re=/\(([^()]+)\)/g;let m;while((m=re.exec(String(w||'')))){const ring=m[1].split(',').map(t=>{const [a,b]=t.trim().split(/\s+/).map(Number);return(a>20&&Math.abs(b)<20)?[a,b]:[b,a]}).filter(c=>c.every(Number.isFinite));if(ring.length>2)out.push(ring)}return out}
const nombreProv=c=>(PROVINCIAS.find(x=>x[0]===c)||[,''])[1];
function nombreMun(prov,mun){const m=municipiosINE.find(x=>x.provincia_id===prov&&String(x.cmun).padStart(3,'0')===mun);return m?m.nombre:''}
function abrirMapa(o){
  if(!window.L)return toast('No se pudo cargar el mapa. Comprueba la conexión a Internet.');
  const ov=document.createElement('div');ov.id='mapov';
  const elegir=o.modo==='elegir';
  ov.innerHTML=`<div class="mtop"><b>${esc(o.titulo||'Mapa')}</b><button id="mgps">📍 Mi ubicación</button><button id="mx">✕</button></div><div id="mapa"></div><div class="mpan" id="mpan">${elegir?'<span class="mu">Toca la parcela en el mapa. Se rellenarán provincia, municipio, polígono, parcela y recinto.</span>':'<span class="mu">Toca una chincheta para ver la finca.</span>'}</div>`;
  document.body.appendChild(ov);
  const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:19,maxZoom:21,attribution:'Imágenes © Esri'});
  const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxNativeZoom:19,maxZoom:21,attribution:'© OpenStreetMap'});
  const rec=L.tileLayer.wms(SIG_WMS,{layers:'AU.Sigpac:recinto',format:'image/png',transparent:true,version:'1.3.0',maxZoom:21,zIndex:5,attribution:'Recintos © FEGA / MAPA'});
  const map=L.map('mapa',{layers:[sat,rec],maxZoom:21}).setView([37.4,-5.9],8);
  L.control.layers({'Satélite':sat,'Mapa':osm},{'Recintos SIGPAC':rec},{collapsed:true}).addTo(map);
  const cerrar=()=>{try{map.remove()}catch{}ov.remove()};
  $('#mx').onclick=cerrar;
  const panel=h=>{$('#mpan').innerHTML=h;setTimeout(()=>map.invalidateSize(),50)};
  // posición del usuario
  let yo=null,yoc=null;
  const ubicar=(centrar)=>{if(!navigator.geolocation)return toast('Este dispositivo no tiene geolocalización.');
    navigator.geolocation.getCurrentPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];
      if(yo){yo.setLatLng(ll);yoc.setLatLng(ll).setRadius(p.coords.accuracy)}else{yoc=L.circle(ll,{radius:p.coords.accuracy,color:'#2a7de1',weight:1,fillOpacity:.12,interactive:false}).addTo(map);yo=L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#2a7de1',fillOpacity:1,interactive:false}).addTo(map)}
      if(centrar)map.setView(ll,Math.max(map.getZoom(),18));
    },()=>toast('No se pudo obtener tu ubicación. Activa el permiso de ubicación para esta web.'),{enableHighAccuracy:true,timeout:20000,maximumAge:0})};
  $('#mgps').onclick=()=>ubicar(true);
  if(elegir){
    let n=0,mk=null,poly=null;
    if(o.lat!=null&&o.lng!=null){map.setView([o.lat,o.lng],18);mk=L.marker([o.lat,o.lng]).addTo(map);ubicar(false)}else ubicar(true);
    map.on('click',async e=>{const id=++n,{lat,lng}=e.latlng;
      if(mk)mk.setLatLng(e.latlng);else mk=L.marker(e.latlng).addTo(map);
      if(poly){map.removeLayer(poly);poly=null}
      panel('<span class="mu">Consultando SIGPAC…</span>');
      try{const d=await sigPunto(lat,lng);if(id!==n)return;
        if(!d.length)return panel('<b>No hay recinto SIGPAC en ese punto</b><div class="mu">Toca dentro de una parcela (no en un camino o fuera de España).</div>');
        const r=d[0],prov=String(r.provincia).padStart(2,'0'),mun=String(r.municipio).padStart(3,'0');
        await cargarCatalogoMunicipios();const mn=nombreMun(prov,mun);
        const rings=wktRings(r.wkt);if(rings.length){poly=L.polygon(rings,{color:'#ffeb3b',weight:3,fillColor:'#ffeb3b',fillOpacity:.15}).addTo(map)}
        const P={prov,mun,munNombre:mn,poligono:r.poligono,parcela:r.parcela,recinto:r.recinto,lat,lng};
        panel(`<b>Pol. ${esc(r.poligono)} · Parc. ${esc(r.parcela)} · Rec. ${esc(r.recinto)}</b><div class="mu">${esc(nombreProv(prov))} · ${esc(mn||('municipio '+mun))} · ${esc(r.superficie)} ha · uso ${esc(r.uso_sigpac||'—')}</div>${d.length>1?'<div class="mu">Hay '+d.length+' recintos en ese punto; se usa el primero.</div>':''}<div class="row"><button class="s" id="mno">Cancelar</button><button id="mok">✔ Usar esta parcela</button></div>`);
        $('#mno').onclick=()=>panel('<span class="mu">Toca otra parcela en el mapa.</span>');
        $('#mok').onclick=()=>{cerrar();o.onPick(P)};
      }catch(err){if(id===n)panel('<b>No se pudo consultar SIGPAC</b><div class="mu">Comprueba la conexión e inténtalo de nuevo ('+esc(err.message||err)+').</div>')}
    });
  }else{
    const pts=[],fs=(o.fincas||[]).filter(hasGeo);
    fs.forEach(f=>{const ll=[+f.lat,+f.lng];pts.push(ll);
      const m=L.marker(ll,{icon:L.divIcon({className:'pin',html:`<span class="pinx">📍</span><span class="pint">${esc(f.finca)}</span>`,iconSize:[0,0],iconAnchor:[0,0]})}).addTo(map);
      m.on('click',()=>{panel(`<b>${esc(f.finca)}</b><div class="mu">${esc([f.variedad,f.municipio,(f.superficie||0)+' ha'].filter(Boolean).join(' · '))}</div><div class="row w"><button id="mfi">Abrir ficha</button><a class="btn s" target="_blank" rel="noopener" href="${mapsUrl(f)}">Google Maps</a></div>`);
        $('#mfi').onclick=()=>{cerrar();cur=f.id;view='detail';render()}})});
    if(!pts.length){toast('Ninguna finca tiene coordenadas todavía.');ubicar(true)}
    else if(pts.length===1){map.setView(pts[0],17);ubicar(false)}
    else{map.fitBounds(pts,{padding:[50,50],maxZoom:16});ubicar(false)}
  }
}
const CACHE_KEY='fincas2_cache_v1',QUEUE_KEY='fincas2_queue_v1';
const getStored=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return []}};
const setStored=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch{toast('Almacenamiento local lleno: exporta una copia.');return false}};
let pendingSync=getStored(QUEUE_KEY),syncing=false;
function status(){const el=$('#net');if(el)el.textContent=(navigator.onLine?'● Conexión':'○ Sin red')+(pendingSync.length?' · '+pendingSync.length+' pendientes':'')}
window.addEventListener('online',()=>{status();syncPending()});window.addEventListener('offline',status);
function queueSave(f,row){const id=f.id||crypto.randomUUID(),item={kind:'finca',id,row,isNew:!f.id};pendingSync=pendingSync.filter(x=>x.id!==id);pendingSync.push(item);if(!setStored(QUEUE_KEY,pendingSync))return null;const existing=fincas.findIndex(x=>x.id===id);const updated={...f,...row,id,anotaciones:f.anotaciones||[],_pending:true};if(existing>=0)fincas[existing]=updated;else fincas.push(updated);setStored(CACHE_KEY,fincas);status();return id}
async function syncPending(){if(syncing||!navigator.onLine||!pendingSync.length)return;const session=(await sb.auth.getSession()).data.session;if(!session)return;syncing=true;try{for(const item of [...pendingSync]){const data={...item.row};let result;if(item.isNew){result=await sb.from('fincas').insert({...data,id:item.id})}else{result=await sb.from('fincas').update(data).eq('id',item.id)}if(result.error)throw result.error;pendingSync=pendingSync.filter(x=>x.id!==item.id);setStored(QUEUE_KEY,pendingSync)}await load();if(view==='list')render()}catch(e){console.warn('Sincronización pendiente:',e.message);toast('Hay cambios pendientes de sincronizar.')}finally{syncing=false;status()}}

const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',6000)};
const lastVisit=f=>{const n=[...(f.anotaciones||[])].sort((a,b)=>a.fecha<b.fecha?1:-1);return n.length?n[0].fecha:null};
const uniq=k=>[...new Set(fincas.map(f=>(f[k]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));

async function signed(paths){const need=paths.filter(p=>!urlCache[p]);if(!need.length)return;const {data}=await sb.storage.from('fotos').createSignedUrls(need,3600);(data||[]).forEach(d=>{if(d.signedUrl)urlCache[d.path]=d.signedUrl})}
function shrink(file,mx=1280,qd=.8){return createImageBitmap(file).then(bm=>{const k=Math.min(1,mx/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',qd))})}

  if(!m){const c=t.match(/(-?\d+,\d+)\s*[;\s]\s*(-?\d+,\d+)/);if(c)m=[0,c[1].replace(',','.'),c[2].replace(',','.')]}

      if(id){const {error}=await sb.from('fincas').update(row).eq('id',id);if(error)throw error}
      else{const {data,error}=await sb.from('fincas').insert(row).select().single();if(error)throw error;id=data.id;
        const t=($('#f_nota')||{value:''}).value.trim();if(t||pend.length){const fotos=await uploadPhotos(id,pend);const r=await sb.from('anotaciones').insert({finca_id:id,texto:t,fotos});if(r.error)throw r.error;pend=[]}}
      await load();cur=id;view='detail';render()}
    catch(e){toast('No se pudo guardar: '+(e.message||e));b.disabled=false;b.textContent='Guardar'}};
}
// ---------- exportar ----------
const fname=e=>'fincas'+(fv?'_'+fv:'')+(fm?'_'+fm:'')+'.'+e;
function dl(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name.replace(/\s+/g,'_');document.body.appendChild(a);a.click();a.remove()}
function exportCsv(){const rows=filtered();if(!rows.length)return toast('No hay fincas con esos filtros.');
  const cols=['finca','propietarios','variedad','patron','superficie_ha','marco_a','marco_b','arboles','municipio','poligono','parcela','latitud','longitud','ultima_visita'];
  const c=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const L=[cols.join(';')].concat(rows.map(f=>[f.finca,f.propietarios,f.variedad,f.patron,f.superficie,f.marco_a,f.marco_b,arb(f),f.municipio,f.poligono,f.parcela,f.lat,f.lng,fmt(lastVisit(f))].map(c).join(';')));
  dl(fname('csv'),new Blob(['\ufeff'+L.join('\n')],{type:'text/csv;charset=utf-8'}))}
function exportPdf(){const rows=filtered();if(!rows.length)return toast('No hay fincas con esos filtros.');
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J)return toast('No se pudo cargar el generador de PDF.');
  const d=new J({orientation:'landscape',unit:'mm',format:'a4'});
  const C=[['Finca',38,f=>f.finca],['Propietarios',42,f=>f.propietarios],['Variedad',28,f=>f.variedad],['Patrón',28,f=>f.patron],['Sup. (ha)',14,f=>f.superficie],['Marco',18,f=>(f.marco_a&&f.marco_b)?f.marco_a+'x'+f.marco_b:''],['Árboles',18,f=>arb(f)],['Municipio',34,f=>f.municipio],['Pol./Parc.',20,f=>(f.poligono||'-')+'/'+(f.parcela||'-')],['Últ. visita',30,f=>fmt(lastVisit(f))]];
  let y=0;
  const head=()=>{d.setFontSize(14);d.setFont(undefined,'bold');d.text('Listado de fincas de cítricos',10,14);d.setFontSize(9);d.setFont(undefined,'normal');d.text('Variedad: '+(fv||'todas')+'   Municipio: '+(fm||'todos')+'   Fecha: '+new Date().toLocaleDateString('es-ES'),10,20);
    y=25;d.setFillColor(47,125,50);d.rect(10,y,270,7,'F');d.setTextColor(255);d.setFont(undefined,'bold');let x=10;C.forEach(c=>{d.text(c[0],x+1,y+5);x+=c[1]});d.setTextColor(0);d.setFont(undefined,'normal');y+=7};
  head();
  rows.forEach((f,i)=>{const cells=C.map(c=>d.splitTextToSize(String(c[2](f)??''),c[1]-2)),h=Math.max(...cells.map(l=>l.length))*4+2;
    if(y+h>196){d.addPage();head()}if(i%2===0){d.setFillColor(242,245,238);d.rect(10,y,270,h,'F')}
    let x=10;cells.forEach((l,j)=>{d.text(l,x+1,y+4.5);x+=C[j][1]});y+=h});
  const tot=rows.reduce((s,f)=>s+(+f.superficie||0),0),ta=rows.reduce((s,f)=>s+arb(f),0);
  if(y+10>196){d.addPage();y=15}d.setFont(undefined,'bold');d.text(rows.length+' fincas  ·  '+tot.toFixed(2)+' ha  ·  '+ta.toLocaleString('es-ES')+' árboles',10,y+7);
  dl(fname('pdf'),d.output('blob'))}
</script></body></html>
