function sigUrl(f){
  // Formato de parámetros publicado en la ayuda oficial del Visor SIGPAC.
  const u=new URL(SIG);

// ---------- mapa integrado (SIGPAC oficial + chinchetas) ----------
const SIG_API='https://sigpac-hubcloud.es/servicioconsultassigpac/query/recinfobypoint/4326/';
const SIG_WMS='https://wms.mapa.gob.es/sigpac/wms';
async function sigPunto(lat,lng){const r=await fetch(SIG_API+lng.toFixed(7)+'/'+lat.toFixed(7)+'.json');if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();return Array.isArray(d)?d:[]}
// GPS: recoger varias lecturas recientes y escoger la de menor incertidumbre.
// La precisión indicada por el navegador es estimada; no sustituye una medición topográfica.
function gpsPreciso({duracion=14000,umbral=20}={}){
 return new Promise((resolve,reject)=>{
  if(!navigator.geolocation)return reject(Error('Geolocalización no disponible'));
  let best=null,watch=null,done=false;
  const fin=(err)=>{if(done)return;done=true;clearTimeout(timer);if(watch!==null)navigator.geolocation.clearWatch(watch);if(best)resolve(best);else reject(err||Error('No se obtuvo posición GPS'));};

   if(!Number.isFinite(a)||!Number.isFinite(pos.coords.latitude)||!Number.isFinite(pos.coords.longitude))return;

 });

// Identidad SIGPAC completa: evita confundir referencias de municipios diferentes.
const sigNorm=v=>String(v??'').trim().replace(/^0+(?=\d)/,'');

const geomCache=new Map();

async function geometriaRecinto(p){
  if(!geolocalizable(p))return null;

    try{const rows=await sigPunto(+p.lat,+p.lng);const r=rows.find(x=>sigCoincide(x,p));if(!r||!r.wkt)return null;

}
const kmlEsc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');

// ---------- pruebas de madurez ----------
const tabsHtml=a=>`<div class="row" style="margin-bottom:10px"><button class="${a==='list'?'':'s'}" data-tab="list">🍊 Fincas</button><button class="${a==='mad'?'':'s'}" data-tab="mad">🧪 Madurez</button></div>`;
function bindTabs(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{const t=b.dataset.tab;if(t===view)return;if(t==='mad'){view='mad';await loadMad()}else view='list';render()})}
async function loadMad(){const {data,error}=await sb.from('madurez').select('*').order('fecha',{ascending:false}).order('creado',{ascending:false});
  if(error){toast(/madurez/.test(error.message||'')?'Falta crear la tabla «madurez» en Supabase (ejecuta el SQL indicado).':'Error al cargar madurez: '+error.message);mads=[];return}mads=data||[]}
// Fórmulas: % zumo = peso zumo / peso muestra × 100 · acidez = ml sosa × 0,128 · I.M. = brix / acidez
const mCalc=m=>{const b=num(m.brix),s=num(m.sosa_ml),pm=num(m.peso_muestra),pz=num(m.peso_zumo);const ac=s!=null?s*0.128:null;return{ac,im:(b!=null&&ac>0)?b/ac:null,pz:(pm>0&&pz!=null)?pz/pm*100:null}};
const f1=(v,d)=>(v==null||!isFinite(v))?'–':v.toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d});
const fLarga=d=>d?new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'}):'—';
const fCorta=d=>d?new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'}):'';
const fincaDe=id=>(fincas.find(x=>x.id===id)||{}).finca||'Sin finca';
const propietarioDe=id=>(fincas.find(x=>x.id===id)||{}).propietarios||'Sin propietario';
const varOpts=sel=>{const all=Object.values(VARIEDADES).flat();return '<option value="">Elegir variedad</option>'+Object.entries(VARIEDADES).map(([g,a])=>`<optgroup label="${g}">${a.map(v=>option(v,v,sel)).join('')}</optgroup>`).join('')+(sel&&!all.includes(sel)?option(sel,sel,sel):'')};
function chartIM(rows){const pts=[...rows].reverse().map(m=>({d:m.fecha,v:mCalc(m).im})).filter(p=>p.v!=null);if(pts.length<2)return'';
  const W=320,H=120,P=26,mn=Math.min(...pts.map(p=>p.v)),mx=Math.max(...pts.map(p=>p.v)),rg=(mx-mn)||1;
  const X=i=>(P+i*(W-2*P)/(pts.length-1)).toFixed(1),Y=v=>(H-P-(v-mn)/rg*(H-2*P)).toFixed(1);
  return `<div class="card"><b>Evolución del I.M.</b><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:6px"><polyline fill="none" stroke="var(--ac2)" stroke-width="2.5" points="${pts.map((p,i)=>X(i)+','+Y(p.v)).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.v)}" r="4" fill="var(--ac)"/><text x="${X(i)}" y="${(+Y(p.v)-8).toFixed(1)}" text-anchor="middle" font-size="10" fill="currentColor">${f1(p.v,1)}</text>`).join('')}<text x="${P}" y="${H-6}" font-size="9" fill="currentColor" opacity=".7">${fCorta(pts[0].d)}</text><text x="${W-P}" y="${H-6}" text-anchor="end" font-size="9" fill="currentColor" opacity=".7">${fCorta(pts[pts.length-1].d)}</text></svg></div>`}

const BACKUP_FORMAT='fincas-respaldo',BACKUP_VERSION=1;
const BACKUP_FIELDS=['finca','propietarios','variedad','patron','superficie','marco_a','marco_b','municipio','poligono','parcela','recinto','lat','lng','prov_cod','mun_cod','parcelas'];
function safeBackupRow(obj,fields){return Object.fromEntries(fields.filter(k=>Object.prototype.hasOwnProperty.call(obj,k)).map(k=>[k,obj[k]]))}
async function allBackupRows(table,selection='*'){

  throw Error('Demasiados registros; no se ha generado una copia incompleta.');
}
async function exportBackup(){
  if(!navigator.onLine)return toast('Conéctate a Internet para obtener una copia completa.');
  if(pendingSync.length)return toast('Sincroniza los cambios pendientes antes de hacer la copia.');

    const meta=[{formato:BACKUP_FORMAT,version:BACKUP_VERSION,fecha,usuario:user.id,fincas:fs.length,anotaciones:ns.length,madurez:ms.length,nota:'No incluye archivos binarios de fotografías'}];

      const sh=XLSX.utils.json_to_sheet(rows.map(row=>({id:row.id,registro_json:JSON.stringify(row)})));
      if(!rows.length)XLSX.utils.sheet_add_aoa(sh,[['id','registro_json']],{origin:'A1'});
      sh['!cols']=[{wch:38},{wch:90}];XLSX.utils.book_append_sheet(wb,sh,name);
    }
    XLSX.writeFile(wb,'CopiaSeguridadFincas.xlsx');
    localStorage.setItem('fincas_ultima_copia_manual',fecha);
    toast('Excel generado: '+fs.length+' fincas, '+ns.length+' anotaciones, '+ms.length+' pruebas. Guárdalo en iCloud Drive.');
  }catch(e){alert('No se pudo generar la copia: '+e.message)}

async function restoreBackup(file){
  if(!navigator.onLine)return toast('Debes estar conectado para restaurar.');
  if(pendingSync.length)return toast('Sincroniza antes los cambios pendientes.');
  try{
    if(file.size>25*1024*1024)throw Error('Archivo demasiado grande (máximo 25 MB).');
    let doc;
    if(/\.xlsx$/i.test(file.name)){
      if(typeof XLSX==='undefined')throw Error('No se ha cargado la biblioteca Excel.');
      const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
      for(const sheet of ['CONTROL','FINCAS','ANOTACIONES','MADUREZ'])if(!wb.Sheets[sheet])throw Error('Falta la hoja '+sheet);
      const control=XLSX.utils.sheet_to_json(wb.Sheets.CONTROL)[0];
      if(!control)throw Error('Hoja de control vacía.');
      const parseRows=sheet=>XLSX.utils.sheet_to_json(wb.Sheets[sheet]).map(row=>JSON.parse(row.registro_json));
      doc={formato:control.formato,version:Number(control.version),fecha:control.fecha,usuario:control.usuario,contenido:{fincas:parseRows('FINCAS'),anotaciones:parseRows('ANOTACIONES'),madurez:parseRows('MADUREZ')}};
    }else{doc=JSON.parse(await file.text())}
    if(doc.formato!==BACKUP_FORMAT||doc.version!==BACKUP_VERSION||!doc.contenido||!['fincas','anotaciones','madurez'].every(k=>Array.isArray(doc.contenido[k])))throw Error('Copia incompatible.');
    const {data:{user}}=await sb.auth.getUser();if(!user)throw Error('Debes iniciar sesión.');
    if(doc.usuario!==user.id)throw Error('Esta copia pertenece a otra cuenta.');
    const fs=doc.contenido.fincas,ns=doc.contenido.anotaciones,ms=doc.contenido.madurez;
    if(fs.length>10000||ns.length>100000||ms.length>100000)throw Error('Se exceden los límites admitidos.');
    if(!confirm('Restaurar copia de '+new Date(doc.fecha).toLocaleString('es-ES')+'\n'+fs.length+' fincas · '+ns.length+' anotaciones · '+ms.length+' pruebas.\n\nSolo se añadirán registros que no existan. ¿Continuar?'))return;
    const [liveF,liveN,liveM]=await Promise.all([allBackupRows('fincas','id'),allBackupRows('anotaciones','id'),allBackupRows('madurez','id')]);
    const seenF=new Set(liveF.map(x=>x.id)),seenN=new Set(liveN.map(x=>x.id)),seenM=new Set(liveM.map(x=>x.id));
    let countF=0,countN=0,countM=0;
    for(const f of fs){if(!f||typeof f.id!=='string'||seenF.has(f.id))continue;const row={id:f.id,...safeBackupRow(f,BACKUP_FIELDS)};const {error}=await sb.from('fincas').insert(row);if(error)throw Error('Finca '+(f.finca||f.id)+': '+error.message);seenF.add(f.id);countF++}
    for(const n of ns){if(!n||typeof n.id!=='string'||seenN.has(n.id)||!seenF.has(n.finca_id))continue;const row={id:n.id,finca_id:n.finca_id,...safeBackupRow(n,['fecha','texto','fotos'])};const {error}=await sb.from('anotaciones').insert(row);if(error)throw Error('Anotación '+n.id+': '+error.message);seenN.add(n.id);countN++}
    for(const m of ms){if(!m||typeof m.id!=='string'||seenM.has(m.id)||(m.finca_id&&!seenF.has(m.finca_id)))continue;const row={id:m.id,...safeBackupRow(m,['fecha','finca_id','variedad','brix','sosa_ml','peso_muestra','peso_zumo','calibres'])};const {error}=await sb.from('madurez').insert(row);if(error)throw Error('Madurez '+m.id+': '+error.message);seenM.add(m.id);countM++}
    await load();view='list';render();alert('Recuperación terminada. Añadidas: '+countF+' fincas, '+countN+' anotaciones y '+countM+' pruebas.\nLas imágenes no están incluidas.');
  }catch(e){await load();render();alert('Recuperación interrumpida: '+e.message+'\nLos registros ya importados permanecen guardados.');}
}

  const tot=rows.reduce((s,f)=>s+(+f.superficie||0),0),ta=rows.reduce((s,f)=>s+arb(f),0);
  if(y+10>bottom){d.addPage();y=16}else y+=3;
  d.setDrawColor(47,105,51);d.setLineWidth(.5);d.line(left,y,left+tableW,y);
  d.setFont(undefined,'bold');d.setFontSize(9);d.setTextColor(25,45,28);d.text(rows.length+' fincas   ·   '+tot.toFixed(2)+' ha   ·   '+ta.toLocaleString('es-ES')+' árboles',left,y+6);
  dl(fname('pdf'),d.output('blob'))}
</script></body></html>
